name: bump

# The Release workflow in simple-english fires this right after it
# publishes the gem. workflow_dispatch covers a manual rerun.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [gem-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite the formula when a newer gem is out
        id: bump
        # The dispatch can beat the rubygems index: the workflow may
        # run before the new version shows up. Poll for up to two
        # minutes, then end as a no-op.
        run: |
          msg=""
          for _ in $(seq 1 12); do
            msg="$(ruby scripts/bump.rb)"
            [ -n "$msg" ] && break
            sleep 10
          done
          if [ -n "$msg" ]; then
            echo "transition=$msg" >> "$GITHUB_OUTPUT"
            echo "version=${msg##* -> }" >> "$GITHUB_OUTPUT"
          fi

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.bump.outputs.version != ''
        with:
          branch: bump/v${{ steps.bump.outputs.version }}
          title: ${{ steps.bump.outputs.transition }}
          commit-message: ${{ steps.bump.outputs.transition }}
          add-paths: Formula/simple-english.rb
          draft: true
          sign-commits: true
