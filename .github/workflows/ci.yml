name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      # The formula serves arm64 darwin, aarch64 linux, and x86_64
      # linux. GitHub has no arm64 linux runner, so the other two
      # cover the install paths.
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Set up the Git user
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Test the formulae
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-tap-syntax
          brew test-bot --only-formulae
